name: One-time preview source import

on:
  push:
    branches:
      - chore/import-preview-ui
    paths:
      - .github/workflows/import-preview-ui.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated import branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy pinned ThryveMS preview snapshot
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=72bdb56f97c55f4b69bc27db27343fc3578e2ab1
          git clone --quiet https://github.com/dbauto/afdhlskdfs-iqms-preview.git "$RUNNER_TEMP/thryvems-preview-source"
          git -C "$RUNNER_TEMP/thryvems-preview-source" checkout --quiet --detach "$SOURCE_SHA"
          test "$(git -C "$RUNNER_TEMP/thryvems-preview-source" rev-parse HEAD)" = "$SOURCE_SHA"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf -- {} +
          rsync -a --exclude=.git --exclude=.github/workflows/ "$RUNNER_TEMP/thryvems-preview-source/" ./
          test -f AGENTS.md
          test -f app/UI-GUIDELINES.md
          test -f plan/iQMS-Consolidated-Backend-Plan-v3.md
          test -f plan/progress.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: clone preview UI from \$SOURCE_SHA"
          git push origin HEAD:refs/heads/chore/import-preview-ui
